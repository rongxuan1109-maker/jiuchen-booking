<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light only">
<style>:root{color-scheme:light}[hidden]{display:none!important}</style>
</head>
<body>
<title>診所待辦</title>
<style>
/* 診所待辦(目標版):極簡、冷色系海洋風、固定淺色。可以按的東西至少 48×48,彼此至少隔 8。
   顏色:深海藍當主色(字、主要按鈕)、青綠=做完、水藍=現在,底是很淺的霧白水藍;
   珊瑚色只用在「先做」和錯誤提示。 */
:root {
  color-scheme: light;
  --bg: #f2f8fb; --card: #ffffff; --soft: #e6f1f6;
  --ink: #0c2d48; --ink2: #35566f; --ink3: #4d6b82; --ph: #58758b;
  --line: #d5e4ec; --line2: #b7cdd9;
  --sea: #0b4f7a; --sea-d: #093d5f;
  --aqua: #1b8fc4; --aqua-t: #0d6a99;
  --teal: #12a594; --teal-t: #0a756b;
  --coral: #e8705f; --coral-t: #bd3d2a; --coral-line: #f1b9ae; --coral-bg: #fdf1ee;
  --jc: #10a37f; --zs: #f08c00; --dz: #8b5cf6; --ot: #9aa0ab;
  --t-jc: #def5ee; --t-zs: #fdeed8; --t-dz: #ede6fe; --t-ot: #eef0f3;
  --shadow: 0 1px 2px rgba(12, 45, 72, 0.05), 0 6px 18px rgba(12, 45, 72, 0.07);
  --shadow-up: 0 -1px 2px rgba(12, 45, 72, 0.04), 0 -6px 18px rgba(12, 45, 72, 0.06);
  --ring: 0 0 0 4px rgba(27, 143, 196, 0.18);
  --r: 18px;
}
html, body { height: 100%; margin: 0; background: #f2f8fb; overflow: hidden; overscroll-behavior: none; }
body {
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, a, [role="button"] { touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; cursor: pointer; }
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.ic { flex: none; display: block; }
.vh { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.shell { position: fixed; left: 0; right: 0; top: 0; height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.slot, .tabsbox { flex: 0 0 auto; background: var(--card); }
.srow { display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.45; color: var(--ink); }
.srow > span { flex: 1 1 auto; min-width: 0; }
.srow.info { min-height: 48px; color: var(--ink2); }
.srow.warn { color: var(--coral-t); }

.view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.view.off { visibility: hidden; }
[inert] { pointer-events: none; }
.bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; min-height: 66px; padding: 9px max(16px, calc(50% - 364px)); background: var(--card); border-bottom: 1px solid var(--line); }
.bar h1 { flex: 1 1 auto; font-size: 21px; font-weight: 700; letter-spacing: 0.03em; color: var(--sea); }
.bar-mid { flex: 1 1 auto; text-align: center; font-size: 14px; color: var(--ink3); }
.who { flex: none; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%; background: linear-gradient(145deg, #0b4f7a, #0d6a99); font-size: 16px; font-weight: 600; color: #ffffff; box-shadow: 0 2px 8px rgba(11, 79, 122, 0.25); }
.ibtn { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 48px; height: 48px; padding: 0; border: 0; border-radius: 14px; background: transparent; color: var(--sea); }
.ibtn.text { padding: 0 12px; font-size: 15px; font-weight: 600; color: var(--aqua-t); }
.scroll { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 28px; }
.loading { padding: 32px 16px; font-size: 15px; color: var(--ink2); text-align: center; }

.demo { margin-bottom: 8px; font-size: 13px; color: var(--ink3); }
.sum { font-size: 15px; color: var(--ink2); }
.sum b { font-size: 24px; font-weight: 700; color: var(--sea); font-variant-numeric: tabular-nums; }
.sec { margin: 24px 0 12px; font-size: 14px; font-weight: 700; color: var(--ink2); letter-spacing: 0.06em; }
.none { margin: 0 0 12px; font-size: 14px; color: var(--ink3); }

/* 首頁的一個目標 */
.goal, .node, .fold, .btn, .pick, .tab, .switch, .thumb, .ibtn, .who, .crow { transition: transform 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease; }
.goal { display: block; width: 100%; margin: 0 0 12px; padding: 16px 16px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); text-align: left; }
.goal.flash { border-color: var(--aqua); box-shadow: var(--shadow), var(--ring); }
.g-title { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
.g-name { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pri { flex: none; padding: 0 7px; border: 1px solid var(--coral-line); border-radius: 8px; background: var(--coral-bg); font-size: 13px; font-weight: 700; line-height: 22px; color: var(--coral-t); }
.slow { flex: none; padding: 0 7px; border: 1px solid var(--line2); border-radius: 8px; font-size: 13px; font-weight: 600; line-height: 22px; color: var(--ink3); }
/* 彩色圖示方塊:照線上卡片風:粉彩底色=哪一家,好幾家斜切成雙色、三色。只是裝飾,不是按鈕 */
.tile { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: var(--t-ot); color: #434651; }
.tile .ic { width: 24px; height: 24px; }
.tile.sm { width: 34px; height: 34px; border-radius: 11px; box-shadow: none; }
.tile.sm .ic { width: 19px; height: 19px; }
.tile.lg { width: 56px; height: 56px; border-radius: 18px; }
.tile.lg .ic { width: 30px; height: 30px; }
.ghead { display: flex; align-items: center; gap: 14px; }
.ghead .gtitle { flex: 1 1 auto; min-width: 0; }
.iconbtn { justify-content: flex-start; gap: 10px; padding: 0 14px 0 10px; color: var(--ink2); }
.iconbtn .grow { flex: 1 1 auto; }
.iconbtn > span:last-child { color: var(--aqua-t); }
.picks.icons { margin-top: 10px; }
.picks.icons .pick { flex-direction: column; gap: 4px; min-height: 76px; font-size: 13px; }
.cdots { flex: none; display: inline-flex; align-items: center; gap: 5px; }
.c-jc { --c: var(--jc); } .c-zs { --c: var(--zs); } .c-dz { --c: var(--dz); } .c-ot { --c: var(--ot); }
.cdots i, .ctag i, .pick i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--ot)); }
.dots { display: flex; align-items: center; height: 20px; margin: 16px 3px 12px; }
.dots.empty { height: 2px; margin: 16px 0 14px; border-top: 2px dashed var(--line2); }
.d { flex: none; display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line2); border-radius: 50%; background: var(--card); }
.d.done { border-color: var(--teal); background: var(--teal); }
.d.now { width: 18px; height: 18px; border: 2.500px solid var(--aqua); background: radial-gradient(var(--sea) 0 4px, #ffffff 4.500px); box-shadow: var(--ring); }
.ln { flex: 1 1 0; max-width: 46px; height: 4px; background: var(--line); }
.ln.on { background: var(--teal); }
.ln.tonow { background: linear-gradient(90deg, #12a594, #1b8fc4); }
.dots.many .ln { max-width: 20px; }
.g-now { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 14px; color: var(--ink2); }
.g-now b, .nowtag { flex: none; font-size: 13px; font-weight: 700; color: var(--aqua-t); }
.g-now .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-now em { flex: none; font-style: normal; font-size: 13px; color: var(--ink3); }
.g-now .g-count { flex: none; margin-left: auto; font-size: 13px; font-weight: 600; color: var(--ink3); font-variant-numeric: tabular-nums; }
.g-now.ok { color: var(--teal-t); font-weight: 600; }
.g-now.none { color: var(--ink3); }
.ctag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); }
.fold { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 52px; margin: 10px 0 12px; padding: 0 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); font-size: 15px; color: var(--ink2); text-align: left; }
.fold[aria-expanded="true"] .ic { transform: rotate(180deg); }
.fold.plain { color: var(--ink); box-shadow: var(--shadow); }
.fold.plain span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tabsbox { position: relative; z-index: 1; box-shadow: var(--shadow-up); }
.tabs { display: flex; gap: 10px; padding: 10px max(12px, calc(50% - 368px)); border-top: 1px solid var(--line); background: var(--card); }
.tab { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; padding: 0; border: 0; border-radius: 14px; background: transparent; font-size: 13px; color: var(--ink3); }
.tab.on { background: var(--soft); font-weight: 700; color: var(--sea); }
.tab.add { color: var(--aqua-t); font-weight: 600; }

/* 目標頁 */
.gtitle { font-size: 22px; font-weight: 700; line-height: 1.4; color: var(--ink); overflow-wrap: anywhere; }
.gmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 8px; }
.gprog { margin-top: 14px; font-size: 14px; color: var(--ink2); }
.gprog b { font-size: 18px; font-weight: 700; color: var(--sea); }
.pbar { height: 6px; margin-top: 8px; border-radius: 6px; background: var(--line); overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #12a594, #1b8fc4); }
.banner { margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--soft); font-size: 14px; color: var(--ink2); }
.banner.ok { color: var(--teal-t); }
.nodes { display: flex; flex-direction: column; gap: 10px; }
.node { position: relative; display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 62px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); box-shadow: var(--shadow); text-align: left; }
.node::before { content: ""; position: absolute; left: 24px; top: 38px; bottom: -24px; width: 3px; border-radius: 3px; background: var(--line); }
.node:last-child::before { display: none; }
.node.done::before { background: var(--teal); }
.node.done.tonow::before { background: linear-gradient(180deg, #12a594, #1b8fc4); }
.nd { position: relative; z-index: 1; flex: none; display: grid; place-items: center; width: 24px; height: 24px; margin-top: 1px; border: 2px solid var(--line2); border-radius: 50%; background: var(--card); color: #ffffff; }
.nd .ic { width: 14px; height: 14px; stroke-width: 3; }
.node.done .nd { border-color: var(--teal); background: var(--teal); }
.node.done .n-name { color: var(--ink3); }
.node.now { border-color: var(--aqua); box-shadow: var(--shadow), var(--ring); }
.node.now .nd { border-color: var(--aqua); background: radial-gradient(var(--sea) 0 5px, #ffffff 5.500px); }
.n-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.n-name { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.n-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 20px; font-size: 13px; color: var(--ink3); }
.mk { display: inline-flex; color: var(--ink3); }
.mk .ic { width: 16px; height: 16px; }
.addrow { display: flex; gap: 10px; margin-top: 18px; }
.addrow .inp { flex: 1 1 auto; min-width: 0; }

/* 輸入和按鈕 */
.lab { display: block; margin: 16px 0 6px; font-size: 14px; font-weight: 600; color: var(--ink2); }
.inp { display: block; width: 100%; min-height: 50px; padding: 12px 14px; border: 1px solid var(--line2); border-radius: 14px; background: #ffffff; font: inherit; font-size: 16px; color: var(--ink); -webkit-appearance: none; appearance: none; }
.inp:focus { outline: none; border-color: var(--aqua); box-shadow: var(--ring); }
.inp::placeholder { color: var(--ph); opacity: 1; }
.area { resize: none; line-height: 1.5; }
input[type="date"].inp { min-width: 0; }
.fstat { display: flex; align-items: center; gap: 10px; min-height: 24px; margin-top: 4px; font-size: 13px; color: var(--ink3); }
.fstat.ok { color: var(--teal-t); font-weight: 600; }
.fstat.warn { color: var(--coral-t); margin-top: 8px; }
.fstat.warn span { flex: 1 1 auto; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 48px; min-height: 50px; padding: 0 18px; border: 1px solid var(--line2); border-radius: 14px; background: #ffffff; font-size: 15px; font-weight: 600; color: var(--sea); text-decoration: none; white-space: nowrap; }
.btn.main { border-color: var(--sea); background: linear-gradient(180deg, #0d5a8a, #0b4f7a); color: #ffffff; box-shadow: 0 2px 8px rgba(11, 79, 122, 0.22); }
.btn.danger { color: var(--ink2); font-weight: 500; }
.btn.wide { width: 100%; }
.btn.small { flex: none; }
.btn.big { min-height: 66px; font-size: 18px; }
.btn.link { justify-content: flex-start; color: var(--aqua-t); }
.btn.link span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row2 { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.row2 > .inp, .row2 > .link { flex: 1 1 auto; min-width: 0; }
.row2.end { margin-top: 22px; }
.row2.end > .btn { flex: 1 1 0; }
.col2 { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.switch { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 58px; margin-top: 14px; padding: 0 16px; border: 1px solid var(--line2); border-radius: 16px; background: #ffffff; font-size: 16px; font-weight: 600; }
.switch.on { border-color: var(--teal); background: #eef8fb; }
.sw { position: relative; flex: none; width: 52px; height: 30px; border-radius: 15px; background: var(--line2); transition: background 0.14s; }
.sw i { position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 3px rgba(12, 45, 72, 0.25); transition: transform 0.14s; }
.switch.on .sw { background: var(--teal); }
.switch.on .sw i { transform: translateX(22px); }
.tiny { margin-top: 6px; font-size: 13px; color: var(--ink3); }
.sub { margin: 24px 0 0; font-size: 14px; font-weight: 700; color: var(--ink2); }
.sub + .btn.wide, .row2 + .btn.wide, .thumbs + .btn.wide, .up + .btn.wide { margin-top: 10px; }
.formbox { margin-top: 10px; padding: 0 14px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); }
.err { margin-top: 10px; font-size: 14px; color: var(--coral-t); }
.endrow { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
.endrow .btn { margin-top: 10px; }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.picks.n3 { grid-template-columns: repeat(3, 1fr); }
.pick { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 50px; padding: 0 8px; border: 1px solid var(--line2); border-radius: 14px; background: #ffffff; font-size: 15px; font-weight: 600; color: var(--ink2); }
.pick.on { border-color: var(--sea); background: var(--sea); color: #ffffff; }
.pick.on i { box-shadow: 0 0 0 2px #ffffff; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.thumb { display: grid; place-items: center; aspect-ratio: 1; min-height: 48px; padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--soft); overflow: hidden; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.up { margin-top: 10px; padding: 12px 14px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); font-size: 14px; color: var(--ink2); }
.up.warn { color: var(--coral-t); }
.bigimg { display: grid; place-items: center; min-height: 160px; margin-top: 10px; border-radius: 16px; background: var(--soft); overflow: hidden; }
.bigimg img { display: block; max-width: 100%; max-height: 60vh; }
.ask { margin-top: 12px; font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.gate { padding-top: 32px; }
.logrow { display: flex; flex-direction: column; gap: 2px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; overflow-wrap: anywhere; }
.lg-top { font-size: 13px; color: var(--ink3); }

/* 卡片固定從上面 28px 的地方開始,下面的提示出現或消失時,卡片裡的東西不會跟著移位 */
.layer { position: absolute; inset: 0; z-index: 5; }
.backdrop { position: absolute; inset: 0; background: rgba(12, 45, 72, 0.42); cursor: default; }
.sheet { position: absolute; left: 0; right: 0; top: 28px; bottom: 0; display: flex; flex-direction: column; border-radius: 24px 24px 0 0; background: var(--card); box-shadow: 0 -10px 36px rgba(12, 45, 72, 0.2); animation: up 0.18s ease-out; }
.layer.center .sheet { left: 16px; right: 16px; top: 96px; bottom: auto; max-height: calc(100% - 112px); border-radius: 24px; }
.sh-head { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 66px; padding: 9px 8px 9px 18px; border-bottom: 1px solid var(--line); }
.sh-title { flex: 1 1 auto; font-size: 18px; font-weight: 700; color: var(--sea); }
.sh-body { padding: 0 16px 24px; }
@keyframes up { from { transform: translateY(24px); opacity: 0.4; } to { transform: none; opacity: 1; } }
@media (min-width: 720px) {
  .sheet { left: 50%; right: auto; width: 560px; margin-left: -280px; top: 24px; bottom: 24px; border-radius: 24px; }
  .layer.center .sheet { left: 50%; right: auto; top: 120px; bottom: auto; max-height: calc(100% - 144px); }
}

/* 時間圖 */
.hscroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; background: var(--card); border-bottom: 1px solid var(--line); }
.chart { margin: 0 auto; padding: 0 16px; }
.cin { position: relative; padding-bottom: 14px; }
.axis { position: relative; height: 46px; border-bottom: 1px solid var(--line); }
.month { position: absolute; top: 0; height: 46px; padding-left: 7px; border-left: 1px solid var(--line); font-size: 13px; font-weight: 600; line-height: 30px; color: var(--ink2); white-space: nowrap; overflow: hidden; }
.today { position: absolute; top: 46px; bottom: 0; z-index: 2; width: 0; border-left: 2px solid var(--sea); pointer-events: none; }
.today b { position: absolute; left: -17px; top: -20px; padding: 0 5px; border-radius: 7px; background: var(--sea); font-size: 13px; font-weight: 600; font-style: normal; line-height: 19px; color: #ffffff; white-space: nowrap; }
.crow { position: relative; display: block; min-height: 66px; margin-top: 8px; padding-top: 6px; border-bottom: 1px solid var(--soft); }
.ctitle { position: relative; z-index: 3; display: block; height: 24px; }
.ct-in { position: sticky; left: 16px; display: inline-flex; align-items: baseline; gap: 8px; max-width: calc(100vw - 32px); padding-right: 8px; background: var(--card); font-size: 14px; }
.ct-name { min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct-date { flex: none; font-size: 13px; color: var(--ink3); }
.crow.complete .ct-name { color: var(--ink3); }
.ctrack { position: relative; display: block; height: 32px; }
.cbar { position: absolute; top: 12px; height: 8px; border-radius: 4px; background: var(--line); }
.cbar.done { background: linear-gradient(90deg, #12a594, #1b8fc4); }
.cd { position: absolute; top: 16px; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid var(--line2); border-radius: 50%; background: #ffffff; }
.cd.done { border-color: var(--teal); background: var(--teal); }
.cd.now { width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 2.500px solid var(--aqua); background: radial-gradient(var(--sea) 0 4px, #ffffff 4.500px); box-shadow: var(--ring); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 13px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tline { display: inline-block; width: 2px; height: 14px; background: var(--sea); }
.hint { margin-top: 6px; font-size: 13px; color: var(--ink3); }

/* 按下去的輕微回饋(0.12 秒),和「這一下不算」時的一圈水波 */
@media (hover: hover) {
  .goal:hover, .node:hover, .fold:hover, .btn:hover, .pick:hover { border-color: var(--aqua); }
  .btn.main:hover, .pick.on:hover { border-color: var(--sea); }
}

/* ===== 待辦密碼(只有接資料庫的正式頁、測試頁才有;示範版不會走到) ===== */
var MSG_KEY_LOST = "待辦密碼不對，或是已經換過了，剛剛那一筆還沒存到。請重新輸入密碼，輸入後會自動再存一次。";

    var g = {};

      state.phase = state.me ? "ready" : "who";

/* ===== 正在打的字:停 1 秒自動存;沒存到字還在;草稿先放在這台裝置上 ===== */
/* 今天往前、往後各 5 年的同一天(含當天);跟選日期的框、資料層是同一條線 */

function rangeText(g) {

  if (a && b) return a === b ? fmtDate(a) : fmtDate(a) + "～" + fmtDate(b);
  if (a) return fmtDate(a) + " 開始";

function fieldKey(goalId, nodeKey, name) { return goalId + "|" + (nodeKey || "") + "|" + name; }

  if ((p.name === "note" || p.name === "gnote") && value.length > LIMIT.note) { f.status = "long"; render(); return; }
  if (isDateField(p.name) && value && !dateOk(value)) { f.status = "baddate"; render(); return; }
  if (p.name === "gstart" || p.name === "gend") {

    var a = p.name === "gstart" ? value : fieldValue(fieldKey(p.goal, "", "gstart"));
    var b = p.name === "gend" ? value : fieldValue(fieldKey(p.goal, "", "gend"));

  if (f.op && state.pending.indexOf(f.op) >= 0 && f.sent === value) return;     /* 這個內容已經在送了 */
  if (value === stored && !(f.op && state.pending.indexOf(f.op) >= 0)) {

  var patch, what;

  if (p.name === "gnote") { patch = { note: value }; what = "改了備註"; }
  else if (p.name === "gstart" || p.name === "gend") {

/* ===== 提示(放在畫面最下面自己的一格,不會蓋住任何按鈕) ===== */
function toast(text, undo) {

    u.timer = setTimeout(function () {
      var i = state.undos.indexOf(u);
      if (i >= 0) { markGone('[data-key="s-undo-' + u.n + '"]'); state.undos.splice(i, 1); renderSlot(); }
    }, UNDO_MS);
  } else {
    clearTimeout(toastTimer);
    var info = state.info = { text: text, n: ++opSeq };

  }

  var h = "";

  var slow = state.pending.some(function (op) { return op.slow; });

/* ===== 換頁和返回:每開一層就記一格,手機的返回會一層一層退 ===== */
function hashOf(nav) {
  var top = nav[nav.length - 1];
  var s = "#/";
  nav.forEach(function (e) {
    if (e.v === "chart") s = "#/chart";
    if (e.v === "goal") s = "#/g/" + e.id;
  });
  if (top.v === "node") s += "/n/" + top.key;
  else if (top.v !== "home" && top.v !== "chart" && top.v !== "goal") s += (s.slice(-1) === "/" ? "" : "/") + top.v;
  return s;

  var fn = push ? "pushState" : "replaceState";
  try { window.history[fn]({ nav: nav }, "", hashOf(nav)); }
  catch (e) {

  }

  histWriteNav(push, state.nav);
}
/* 畫面一律馬上換;「記進歷史」如果碰上返回還沒做完,就排隊等它做完再記,不會漏掉也不會吃掉這一下 */

  flushFields();
  state.nav = state.nav.concat([entry]);

  onEnter(entry);
  render();
}

  n = Math.min(n || 1, state.nav.length - 1);

  flushFields();
  var left = state.nav.slice(state.nav.length - n);
  state.nav = state.nav.slice(0, state.nav.length - n);
  left.forEach(onLeave);
  render();
  var real = n;
  while (real > 0 && pushQueue.length) { pushQueue.pop(); real -= 1; }      /* 還沒記進歷史的那幾格直接取消 */
  if (real > 0 && histOK) {

    /* 加連結打到一半的字:拿回來 */
    var d = null;
    try { d = JSON.parse(memGet(LINK_DRAFT + entry.id + "|" + entry.key)); } catch (e) { d = null; }
    state.linkForm = d && (d.name || d.url) ? { name: String(d.name || ""), url: String(d.url || ""), error: "" } : null;

    if (f && (f.status === "blank" || f.status === "long")) { delete state.fields[fk]; memSet(DRAFT + fk, ""); }
    var fd = fieldKey(entry.id, entry.key, "date");

function inNav(v) { return state.nav.some(function (e) { return e.v === v; }); }

window.addEventListener("popstate", function (e) {
  if (pendingPops > 0) {
    /* 這是我們自己叫的返回:畫面早就換好了,這裡只要對帳 */
    pendingPops -= 1;
    if (!pendingPops) { clearTimeout(popTimer); flushPushQueue(); }
    return;
  }
  /* 手機的返回鍵、邊緣右滑 */
  ownUntil = Date.now() + 60;
  flushFields();
  var nav = e.state && Array.isArray(e.state.nav) && e.state.nav.length ? e.state.nav : [{ v: "home" }];
  var old = state.nav;

/* ===== 畫面 ===== */
/* 彩色圖示方塊:樣子照線上卡片風的斜切粉彩色塊,榮軒 2026-11-26 再指定「每一種圖示都要三色搭配」——

var TILE_PASTEL = { g: ["#d9f4ea", "#0b7a5f"], o: ["#fde9cf", "#a65f00"], p: ["#e9e0fe", "#6d3fd8"], b: ["#dbe9ff", "#1f5fd0"],

/* ----- 時間圖 ----- */
function chartHtml(hide, under) {
  var today = dayNum(twNow().day);
  var rows = [], undated = [];
  sortGoals(allGoals().filter(function (g) { return !isShelved(g); })).forEach(function (g) {
    var list = nodesOf(g).filter(function (n) { return n.date && dateOk(n.date); }).sort(function (a, b) { return dayNum(a.date) - dayNum(b.date); });
    /* 長條:起點 = 目標的開始日和最早的節點日期取較早;終點 = 目標的結束日和最晚的節點日期取較晚。
       目標有開始日、結束日或任何節點日期,就有一條(沒有節點也可以)。 */
    var gs = g.start && dateOk(g.start) ? g.start : "", ge = g.end && dateOk(g.end) ? g.end : "";
    var all = list.map(function (n) { return n.date; }).concat(gs ? [gs] : [], ge ? [ge] : []).sort();
    if (all.length) rows.push({ g: g, list: list, s: all[0], e: all[all.length - 1], gs: gs, ge: ge });
    else if (!isComplete(g)) undated.push(g);
  });
  rows.sort(function (a, b) { return (isComplete(a.g) ? 1 : 0) - (isComplete(b.g) ? 1 : 0) || TERMS.indexOf(a.g.term) - TERMS.indexOf(b.g.term); });
  var h = '<section class="view' + viewAttrs(hide, under) + ' data-key="v-chart">' + topBar("時間圖") +
    '<div class="scroll" data-key="s-chart">';
  if (!rows.length) {
    h += '<div class="wrap"><p class="none">還沒有排了日期的目標。在目標頁或目標設定裡填「開始」「結束」，或在節點卡裡填「預計日期」，這裡就會出現一條。</p></div>';
  } else {
    var min = today, max = today;
    rows.forEach(function (r) { min = Math.min(min, dayNum(r.s)); max = Math.max(max, dayNum(r.e)); });
    var a = new Date(min * 86400000), b = new Date(max * 86400000);
    var start = Math.round(Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), 1) / 86400000);
    var end = Math.round(Date.UTC(b.getUTCFullYear(), b.getUTCMonth() + 1, 0) / 86400000);
    while (end - start < 85) { var e2 = new Date((end + 1) * 86400000); end = Math.round(Date.UTC(e2.getUTCFullYear(), e2.getUTCMonth() + 1, 0) / 86400000); }
    var days = end - start + 1;
    var avail = Math.min(window.innerWidth, 760) - 32;
    var ppd = Math.max(4, Math.floor(avail / days * 100) / 100);
    var width = Math.round(days * ppd);
    var x = function (d) { return Math.round((d - start + 0.5) * ppd * 10) / 10; };
    h += '<div class="hscroll" data-key="hs-chart" data-ppd="' + ppd + '" data-start="' + numDay(start) + '"><div class="chart" style="width:' + (width + 32) + 'px"><div class="cin" style="width:' + width + 'px">';
    h += '<div class="axis">';
    var cur = start, first = true;
    while (cur <= end) {
      var d = new Date(cur * 86400000);
      var mEnd = Math.round(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0) / 86400000);
      var label = (first || d.getUTCMonth() === 0 ? d.getUTCFullYear() + " 年 " : "") + (d.getUTCMonth() + 1) + " 月";
      h += '<span class="month" data-month="' + numDay(cur).slice(0, 7) + '" style="left:' + Math.round((cur - start) * ppd * 10) / 10 + "px;width:" + Math.round((mEnd - cur + 1) * ppd * 10) / 10 + 'px">' + label + "</span>";
      cur = mEnd + 1; first = false;
    }
    h += "</div>";
    h += '<i class="today" data-date="' + numDay(today) + '" style="left:' + x(today) + 'px"><b>今天</b></i>';
    rows.forEach(function (r) {
      var g = r.g, s = r.s, e = r.e;
      var curNode = currentNode(g);
      /* 綠色只畫到「照日期排,從頭連續做完」的最後一個;中間有還沒做的就停,不會蓋過它 */
      var doneTo = null;
      for (var di = 0; di < r.list.length && r.list[di].done; di++) doneTo = r.list[di].date;
      h += '<div class="crow' + (isComplete(g) ? " complete" : "") + '" role="button" tabindex="0" data-act="open-goal" data-id="' + esc(g.id) + '" data-key="c-' + esc(g.id) + '" data-start="' + s + '" data-end="' + e + '">' +
        '<span class="ctitle"><span class="ct-in"><span class="ct-name">' + esc(titleOf(g)) + '</span><span class="ct-date">' + esc(s === e ? fmtDate(s) : fmtDate(s) + "～" + fmtDate(e)) + "</span></span></span>" +
        '<span class="ctrack"><i class="cbar" style="left:' + x(dayNum(s)) + "px;width:" + Math.max(0, x(dayNum(e)) - x(dayNum(s))) + 'px"></i>';
      if (doneTo) h += '<i class="cbar done" style="left:' + x(dayNum(s)) + "px;width:" + Math.max(0, x(dayNum(doneTo)) - x(dayNum(s))) + 'px"></i>';
      /* 目標自己填的開始日、結束日:長條兩頭各一個小標記(沒有節點也看得出從哪到哪) */
      if (r.gs) h += '<i class="cedge" data-edge="start" data-date="' + r.gs + '" style="left:' + x(dayNum(r.gs)) + 'px"></i>';
      if (r.ge) h += '<i class="cedge" data-edge="end" data-date="' + r.ge + '" style="left:' + x(dayNum(r.ge)) + 'px"></i>';
      r.list.forEach(function (n) {
        h += '<i class="cd' + (n.done ? " done" : curNode && n.key === curNode.key ? " now" : "") + '" data-date="' + n.date + '" style="left:' + x(dayNum(n.date)) + 'px"></i>';
      });
      h += "</span></div>";
    });
    h += "</div></div></div>";
    h += '<div class="wrap"><p class="legend"><span><i class="d done"></i>做完</span><span><i class="d now"></i>現在</span><span><i class="d"></i>還沒做</span><span><i class="tline"></i>今天</span></p>' +
      '<p class="hint">左右滑可以看前後的月份。點一條就打開那個目標。</p></div>';
  }
  h += '<div class="wrap">';
  if (undated.length) {
    h += '<h2 class="sec">還沒排日期</h2>';
    undated.forEach(function (g) {
      h += '<button class="fold plain" type="button" data-act="open-goal" data-id="' + esc(g.id) + '" data-key="u-' + esc(g.id) + '"><span>' + esc(titleOf(g)) + "</span></button>";
    });
  }
  h += "</div></div></section>";
  return h;
}

/* ===== 圖片:先在手機上縮小,再傳;看得到進度,可以取消,失敗可以再試 ===== */
function loadImages(goalId, nodeKey) {
  Platform.getImages(goalId, nodeKey).then(function (res) {
    Object.keys(res || {}).forEach(function (k) { state.imgCache[goalId + "/" + nodeKey + "/" + k] = res[k]; });
    render();
  }, function (err) {
    if (err && err.code === "bad_key") askKey(MSG_KEY_LOST);
    /* 其他讀不到的情況:先顯示「讀取中」,下次打開再讀 */
  });
}
function blobOf(canvas, q) {
  return new Promise(function (resolve) { canvas.toBlob(function (b) { resolve(b); }, "image/jpeg", q); });
}
function readFileAsImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var im = new Image();
    im.onload = function () { resolve({ im: im, done: function () { URL.revokeObjectURL(url); } }); };
    im.onerror = function () { URL.revokeObjectURL(url); reject(new Error("not_image")); };
    im.src = url;
  });
}
function shrinkImage(file) {
  return readFileAsImage(file).then(function (r) {
    var w0 = r.im.naturalWidth, h0 = r.im.naturalHeight;
    if (!w0 || !h0) { r.done(); throw new Error("not_image"); }
    var scale = Math.min(1, IMAGE_SIDE / Math.max(w0, h0));
    var q = 0.82;
    var canvas = document.createElement("canvas");
    function attempt(round) {
      var w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(r.im, 0, 0, w, h);
      return blobOf(canvas, q).then(function (blob) {
        if (!blob) throw new Error("not_image");
        if (blob.size <= IMAGE_BYTES || round >= 14) return { blob: blob, w: w, h: h };
        if (q > 0.5) q -= 0.12; else { scale *= 0.8; q = 0.7; }
        return attempt(round + 1);
      });
    }
    return attempt(0).then(function (res) {
      r.done();
      return new Promise(function (resolve, reject) {
        var fr = new FileReader();
        fr.onload = function () { resolve({ data: String(fr.result), w: res.w, h: res.h, bytes: res.blob.size }); };
        fr.onerror = function () { reject(new Error("not_image")); };
        fr.readAsDataURL(res.blob);
      });
    });
  });
}
function imageCount(goalId, nodeKey) {
  var n = V[goalId] && V[goalId].nodes[nodeKey];
  return Object.keys((n && n.images) || {}).length +
    state.uploads.filter(function (u) { return u.goal === goalId && u.node === nodeKey; }).length;
}
function addFiles(files) {
  var e = findNav("node");
  if (!e) return;
  var room = MAX_IMAGES - imageCount(e.id, e.key);
  var list = Array.prototype.slice.call(files || []);
  var notImage = list.filter(function (f) { return !/^image\//.test(f.type || ""); }).length;
  list = list.filter(function (f) { return /^image\//.test(f.type || ""); });
  var over = Math.max(0, list.length - Math.max(0, room));
  list = list.slice(0, Math.max(0, room));
  list.forEach(function (file) {
    var u = { goal: e.id, node: e.key, key: newKey("i"), file: file, status: "shrinking", progress: 0 };
    state.uploads.push(u);
    startUpload(u);
  });
  if (over) toast("一個節點最多放 " + MAX_IMAGES + " 張圖片，有 " + over + " 張沒有加進去。要加新的，先拿掉一張。");
  else if (notImage) toast("有 " + notImage + " 個檔案不是圖片，沒有加進去。");
  render();
}
function startUpload(u) {
  u.status = u.shrunk ? "uploading" : "shrinking";
  u.progress = 0;
  u.cancelled = false;
  u.ctrl = typeof AbortController === "function" ? new AbortController() : null;
  var ready = u.shrunk ? Promise.resolve(u.shrunk) : shrinkImage(u.file);
  ready.then(function (s) {
    if (u.cancelled) return;
    u.shrunk = s;
    u.status = "uploading";
    render();
    var nodeName = ((V[u.goal] || {}).nodes || {})[u.node] ? V[u.goal].nodes[u.node].name : "";
    return Platform.addImage({ goal: u.goal, node: u.node, key: u.key, data: s.data, w: s.w, h: s.h, by: state.me, what: quote(nodeName) + "加了一張圖片" }, {
      signal: u.ctrl ? u.ctrl.signal : null,
      onProgress: function (p) { if (!u.cancelled) { u.progress = p; render(); } }
    }).then(function (res) {
      if (u.cancelled) return;
      writeGen += 1;
      state.imgCache[u.goal + "/" + u.node + "/" + u.key] = s.data;
      var sg = state.server.goals[u.goal];
      if (sg && sg.nodes[u.node]) {
        sg.nodes[u.node].images = sg.nodes[u.node].images || {};
        sg.nodes[u.node].images[u.key] = (res && res.meta) || { order: Date.now(), w: s.w, h: s.h, bytes: s.bytes };
      }
      state.uploads.splice(state.uploads.indexOf(u), 1);
      render();
      reload();
    });
  }).catch(function (err) {
    if (u.cancelled) return;
    var code = (err && (err.code || err.message)) || "";
    if (code === "bad_key") {
      u.status = "failed";
      askKey("待辦密碼不對，或是已經換過了，圖片還沒傳上去。請重新輸入密碼，再按那張圖片的「再試一次」。");
      return;
    }
    if (/^(not_image|too_many|image_too_big|storage_full|no_such|bad_)/.test(code)) {
      state.uploads.splice(state.uploads.indexOf(u), 1);
      toast(refuseText(code));
    } else {
      u.status = "failed";
    }
    render();
  });
}

/* 表單裡的開始日、結束日有沒有問題;沒問題回空字串 */
function rangeProblem(a, b) {
  if ((a && !dateOk(a)) || (b && !dateOk(b))) return "開始日、結束日要在今天前後 " + DATE_YEARS + " 年內。";
  if (a && b && b < a) return "結束日不能比開始日早。";
  return "";
}
function saveNewDraft() {
  var f = state.newForm;
  if (f) memSet(NEW_DRAFT, JSON.stringify({ title: f.title, term: f.term, nodes: f.nodes, clinics: f.clinics, icon: f.icon, start: f.start, end: f.end }));
}

/* ===== 手指和點按:防誤觸集中在這裡 =====
   原則:點了一定要有反應。只擋下面四種,而且被擋的時候畫面上會有一圈淡淡的水波,讓人知道「有收到,但這一下不算」。
   1. 手指按住後移動超過 10px,或畫面有跟著捲,放開不算點(這是捲動,不畫水波)。
   2. 同時有兩根手指在畫面上,不算點。
   3. 同一個位置(14px 內)0.5 秒內的第二下不算(連按兩下等於按一次;第二下不會按到剛換上來的東西,
      落在輸入框上也不會讓鍵盤跳出來)。復原那一列消失後 0.5 秒內,它原本那一塊也不收。只管同一個點,別處照常。
   4. 「不是你自己叫出來的」新東西(另一個人改的、圖片剛傳完、存檔失敗的提示…),出現不到 0.3 秒不收點按,
      因為那一下瞄準的是原本在那裡的東西。你自己按出來的新畫面不擋,手快可以一路按下去。
   沒有全域的鎖:做完一個動作、存檔回來,都不會讓下一下沒反應。 */
var gesture = { moved: false, multi: false, scrolled: false, x: 0, y: 0, down: false, endAt: 0 };
var lastTap = { x: -99, y: -99, at: 0 };
var ADD_GUARD_MS = 1200;
var born = typeof WeakMap === "function" ? new WeakMap() : null;
var ownUntil = 0;
if (born && typeof MutationObserver === "function") {
  new MutationObserver(function (list) {
    var now = Date.now();
    if (now < ownUntil) return;                 /* 自己那一下叫出來的,不記 */
    list.forEach(function (m) {
      for (var i = 0; i < m.addedNodes.length; i++) if (m.addedNodes[i].nodeType === 1) born.set(m.addedNodes[i], now);
    });
  }).observe(shell, { childList: true, subtree: true });
}
function isNewborn(el) {
  if (!born) return false;
  var now = Date.now();
  for (var e = el; e && e !== shell; e = e.parentElement) {
    var t = born.get(e);
    if (t && now - t < NEWBORN_MS) return true;
  }
  return false;
}
/* 復原那一列自己消失之後,它原本佔的那一塊 0.5 秒內不收點按(那一下瞄準的是「復原」,不是換上來的東西) */
var goneZones = [];
function markGone(sel) {
  var el = slot.querySelector(sel + ' [data-act="undo"]');      /* 只算「復原」那顆鈕的位置,不是整列,免得擋到不相干的地方 */
  if (!el) return;
  var r = el.getBoundingClientRect();
  goneZones.push({ l: r.left, t: r.top, r: r.right, b: r.bottom, until: Date.now() + SAME_MS });
}
/* 這一下該不該擋:同一個位置 0.5 秒內的第二下,或落在剛消失的復原列上。按鈕、連結、輸入框都一樣 */
function tapRefused(x, y) {
  var now = Date.now();
  if (now - lastTap.at < SAME_MS && Math.abs(x - lastTap.x) <= SAME_PX && Math.abs(y - lastTap.y) <= SAME_PX) return true;
  goneZones = goneZones.filter(function (z) { return z.until > now; });
  return goneZones.some(function (z) { return x >= z.l && x <= z.r && y >= z.t && y <= z.b; });
}
function ripple(x, y) {
  var r = document.createElement("i");
  r.className = "ripple";
  r.style.left = x + "px";
  r.style.top = y + "px";
  document.body.appendChild(r);
  setTimeout(function () { if (r.parentNode) r.parentNode.removeChild(r); }, 420);
}
function gestureStart(x, y, multi) {
  if (multi) { gesture.multi = true; return; }
  gesture = { moved: false, multi: false, scrolled: false, x: x, y: y, down: true, endAt: 0 };
}
function gestureMove(x, y) {
  if (!gesture.down) return;
  if (Math.abs(x - gesture.x) > MOVE_PX || Math.abs(y - gesture.y) > MOVE_PX) gesture.moved = true;
}
function gestureEnd() { gesture.down = false; gesture.endAt = Date.now(); }
var lastTouchAt = 0;
document.addEventListener("touchstart", function (e) {
  lastTouchAt = Date.now();
  gestureStart(e.touches[0].clientX, e.touches[0].clientY, e.touches.length > 1);
}, { capture: true, passive: true });
document.addEventListener("touchmove", function (e) {
  if (e.touches.length > 1) gesture.multi = true;
  gestureMove(e.touches[0].clientX, e.touches[0].clientY);
}, { capture: true, passive: true });
document.addEventListener("touchend", function (e) {
  lastTouchAt = Date.now();
  /* 有些瀏覽器手指只移一點點時不會通知「移動」,所以放開時再用放開的位置量一次 */
  var t = e.changedTouches && e.changedTouches[0];
  if (t) gestureMove(t.clientX, t.clientY);
  /* 在手指放開的當下就擋(不等到「點按」事件):這樣第二下落在輸入框上,鍵盤也不會跳出來 */
  if (t && !e.touches.length && !gesture.moved && !gesture.multi && !gesture.scrolled && e.cancelable && tapRefused(t.clientX, t.clientY)) {
    e.preventDefault();
    ripple(t.clientX, t.clientY);
  }
  if (!e.touches.length) gestureEnd();
}, { capture: true, passive: false });
document.addEventListener("touchcancel", function (e) { gesture.moved = true; if (!e.touches.length) gestureEnd(); }, { capture: true, passive: true });
/* 手指點完之後瀏覽器會補送滑鼠事件,那些不算(不然會把「手指有移動」的紀錄洗掉) */
function afterTouch() { return Date.now() - lastTouchAt < 1000; }
document.addEventListener("mousedown", function (e) {
  if (afterTouch()) return;
  gestureStart(e.clientX, e.clientY, false);
  /* 滑鼠:同一個位置的第二下落在輸入框上,也不讓它拿到游標 */
  if (/^(INPUT|TEXTAREA)$/.test(e.target.nodeName) && tapRefused(e.clientX, e.clientY)) { e.preventDefault(); ripple(e.clientX, e.clientY); }
}, true);
document.addEventListener("mousemove", function (e) { if (e.buttons && !afterTouch()) gestureMove(e.clientX, e.clientY); }, true);
document.addEventListener("mouseup", function () { if (!afterTouch()) gestureEnd(); }, true);
document.addEventListener("scroll", function () { if (gesture.down) gesture.scrolled = true; }, true);

document.addEventListener("click", function (e) {
  var target = e.target && e.target.closest ? e.target.closest("[data-act], a[href]") : null;
  if (!target) return;
  var pointed = e.detail !== 0 && (e.clientX || e.clientY);
  var fromFinger = e.detail !== 0 && Date.now() - gesture.endAt < 800;
  if (fromFinger && pointed && (Math.abs(e.clientX - gesture.x) > MOVE_PX || Math.abs(e.clientY - gesture.y) > MOVE_PX)) gesture.moved = true;
  if (fromFinger && (gesture.moved || gesture.scrolled)) { e.preventDefault(); e.stopPropagation(); return; }
  var now = Date.now();
  var blocked = fromFinger && gesture.multi;
  if (!blocked && pointed && tapRefused(e.clientX, e.clientY)) blocked = true;
  if (!blocked && pointed && isNewborn(target)) blocked = true;
  /* 剛按完「加」:新節點插進來,「加」那一列往下移,手指原本的位置變成剛加的節點。
     1.2 秒內點到節點不算(有水波),免得連按「加」或手抖時跳出節點卡。(檢查 AI 第 2 段量到的誤觸) */
  if (!blocked && pointed && target.getAttribute("data-act") === "open-node" && now - lastAddAt < ADD_GUARD_MS) blocked = true;
  if (blocked) {
    e.preventDefault(); e.stopPropagation();
    if (pointed) ripple(e.clientX, e.clientY);
    return;
  }
  if (pointed) lastTap = { x: e.clientX, y: e.clientY, at: now };
  var act = target.getAttribute("data-act");
  if (!act) return;                       /* 連結:讓瀏覽器自己開新分頁 */
  e.preventDefault();
  ownUntil = Date.now() + 60;
  if (actions[act]) actions[act](target, e);
}, true);

document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter" || e.isComposing || e.keyCode === 229) return;      /* 注音還在選字時按 Enter 不算 */
  var t = e.target;
  if (t && t.getAttribute && t.getAttribute("data-enter")) {
    e.preventDefault();
    ownUntil = Date.now() + 60;
    var act = t.getAttribute("data-enter");
    if (actions[act]) actions[act](t, e);
  } else if (t && t.getAttribute && t.getAttribute("role") === "button" && t.getAttribute("data-act")) {
    e.preventDefault();
    actions[t.getAttribute("data-act")](t, e);
  }
});

document.addEventListener("input", function (e) {
  var t = e.target;
  ownUntil = Date.now() + 60;
  if (!t || !t.getAttribute) return;
  var fk = t.getAttribute("data-field");
  if (fk) { fieldTyped(fk, t.value); return; }
  var form = t.getAttribute("data-form");
  if (form === "link" && state.linkForm) {
    state.linkForm[t.getAttribute("data-name")] = t.value; state.linkForm.error = "";
    var le = findNav("node");
    if (le) memSet(LINK_DRAFT + le.id + "|" + le.key, JSON.stringify({ name: state.linkForm.name, url: state.linkForm.url }));
  }
  else if (form === "new" && state.newForm) { state.newForm[t.getAttribute("data-name")] = t.value; state.newForm.error = ""; saveNewDraft(); }
  else if (form === "add") { state.addText[t.getAttribute("data-name")] = t.value; memSet(ADD_DRAFT + t.getAttribute("data-name"), t.value); }
  else if (form === "set" && state.setForm) { state.setForm[t.getAttribute("data-name")] = t.value; state.setForm.error = ""; }
});
document.addEventListener("change", function (e) {
  var t = e.target;
  if (t === filePick) { addFiles(filePick.files); return; }
  var fk = t && t.getAttribute && t.getAttribute("data-field");
  if (fk && isDateField(fieldParts(fk).name)) fieldTyped(fk, t.value);
  /* 表單裡的日期(新增目標、目標設定):有些瀏覽器選完日期只通知「改好了」 */
  var fm = t && t.getAttribute && t.getAttribute("data-form"), nm = fm && t.getAttribute("data-name");
  if ((nm === "start" || nm === "end") && fm === "new" && state.newForm) { state.newForm[nm] = t.value; state.newForm.error = ""; saveNewDraft(); }
  else if ((nm === "start" || nm === "end") && fm === "set" && state.setForm) { state.setForm[nm] = t.value; state.setForm.error = ""; }
});
document.addEventListener("focusout", function (e) {
  var fk = e.target && e.target.getAttribute && e.target.getAttribute("data-field");
  if (fk && state.fields[fk] && state.fields[fk].timer) commitField(fk);
});

/* 鍵盤彈出來時:畫面高度跟著「看得到的範圍」,正在打的那一格捲到看得到的地方 */
function fitViewport() {
  var vv = window.visualViewport;
  var h = vv ? vv.height : window.innerHeight;
  shell.style.height = Math.round(h) + "px";
  shell.style.top = vv ? Math.round(vv.offsetTop) + "px" : "0px";
  showFocused();
}
function showFocused() {
  var a = document.activeElement;
  if (!a || !/^(INPUT|TEXTAREA)$/.test(a.nodeName) || a === filePick) return;
  var sc = a.closest(".scroll");
  if (!sc) return;
  var r = a.getBoundingClientRect(), s = sc.getBoundingClientRect();
  var bottom = r.bottom;
  var st = a.nextElementSibling;                       /* 輸入框下面那行「已存／沒存到」也要一起看得到 */
  if (!(st && st.classList.contains("fstat")) && a.parentElement.classList.contains("row2")) st = a.parentElement.nextElementSibling;
  if (st && st.classList.contains("fstat")) bottom = st.getBoundingClientRect().bottom;
  if (r.top < s.top + 8) sc.scrollTop -= (s.top + 8 - r.top);
  else if (bottom > s.bottom - 8) sc.scrollTop += Math.min(bottom - (s.bottom - 8), r.top - (s.top + 8));
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fitViewport);
  window.visualViewport.addEventListener("scroll", fitViewport);
}
window.addEventListener("resize", function () { fitViewport(); if (state.phase === "ready") render(); });
document.addEventListener("focusin", function () { setTimeout(showFocused, 60); setTimeout(showFocused, 400); });

/* 切走、鎖手機之前:把正在打的字先送出去;切回來馬上重讀 */
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "hidden") flushFields();
  else if (state.phase !== "loading") { reload(); pump(); }
});
window.addEventListener("pagehide", flushFields);
setInterval(function () {
  if (document.visibilityState === "hidden" || state.phase !== "ready") return;
  if (state.pending.length && state.pending[0].state === "failed") retryAll();
  else reload();
}, Platform.pollMs || 15000);

/* ===== 開始 ===== */
(function start() {
  var who = Platform.presetWho || memGet(WHO_KEY);
  state.me = PEOPLE.indexOf(who) >= 0 ? who : "";
  try {
    var hs = window.history.state;
    if (hs && Array.isArray(hs.nav) && hs.nav.length) state.nav = clone(hs.nav);
    else histWrite(false);
  } catch (e) { histOK = false; }
  fitViewport();
  if (Platform.needsKey && !Platform.hasKey()) { state.phase = "key"; ownUntil = Date.now() + 60; }   /* 剛打開的第一個畫面不算「突然冒出來的」 */
  render();
  reload();
})();
})();
</script>
</body>
